name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 11:00 UTC = 08:00 in Mar del Plata (ART has no DST).
    - cron: "0 11 * * *"

# GITHUB_TOKEN: read the repo, publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a run that is publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Best effort: if a source is down the runner keeps the committed data
      # (the pipeline does not overwrite outputs on a partial failure).
      - name: Run pipeline
        run: python run_pipeline.py
        continue-on-error: true

      - name: Build site
        run: python build_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
